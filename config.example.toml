# Screenshot Translator v0.2.1
# 实际配置：~/.config/screenshot-translator/config.toml
# 修改后会自动重新加载；下一次截图使用新配置。

[app]
# 全局快捷键。
# X11：由 pynput 监听。
# KDE Wayland：注册到 KGlobalAccel，也可以稍后在“系统设置 → 快捷键”中修改。
hotkey = "ctrl+alt+d"
# 第二个快捷键：只调用 Umi-OCR 识别并自动把原文复制到剪贴板（不翻译）。留空禁用。
copy_hotkey = "super+ctrl+shift+o"
# auto / pynput / kglobalaccel
# auto：X11 用 pynput，Wayland 用 KGlobalAccel。
input_backend = "auto"
# 在系统托盘显示图标（KDE StatusNotifierItem）。菜单可截图、打开配置/日志、退出。
tray_icon = true
# 在贴图图像区域按住左键即可拖动；0 表示立即拖动，大于 0 表示需长按相应毫秒。
drag_hold_ms = 0
# 点击贴图和控制按钮以外的位置时关闭贴图。
# 仅 X11 有效；Wayland 不允许全局鼠标监听，请用 × 或再次触发快捷键。
close_on_outside_click = true

[capture]
# auto / qt_x11 / spectacle
# auto：X11 用 qt_x11 直接抓屏，KDE Wayland 用 Spectacle 全屏抓取后再由本程序框选。
backend = "auto"
# 最小有效框选尺寸（逻辑像素）。
min_width = 8
min_height = 8

[ocr]
# Umi-OCR 官方 HTTP API，默认端口 1224。
api_url = "http://127.0.0.1:1224/api/ocr"
# Umi-OCR 未运行时自动尝试启动并隐藏。
auto_start = true
umi_ocr = "~/tools/Umi-OCR_Linux_Paddle_2.1.5/umi-ocr.sh"
startup_timeout_s = 8.0
request_timeout_s = 20.0
# 中文模型同时能识别常见英文，适合默认自动识别源语言。
language = "models/config_chinese.txt"
# 排版解析方案（Umi-OCR tbpu.parser）：
# multi_para(多栏-自然段) / multi_line(多栏-总是换行) / multi_none(多栏-无换行)
# single_para(单栏-自然段) / single_line(单栏-总是换行) / single_none(单栏-无换行)
# single_code(单栏-保留缩进) / none(不做处理)
parser = "multi_para"
# 只识别不翻译时单独使用的解析方案；留空则沿用 parser。
copy_parser = ""
limit_side_len = 2880

[translation]
# 支持：google（免 Key 网页接口）/ google_cloud（官方 Basic v2）/
# libretranslate / identity
# identity 只回显原文，专门用于排查截图、OCR、贴图链路。
backend = "google"
# 默认自动识别源语言，统一翻译到简体中文。
# 若只想英译中，可改 source = "en"。
source = "auto"
target = "zh-CN"
timeout_s = 12.0

[translation.google]
# 免 Key 的非官方接口，可能被 Google 429 限流。
endpoint = "https://translate.googleapis.com/translate_a/single"

[translation.google_cloud]
# Google Cloud Translation Basic v2 官方接口；Key 放在 ~/.config/screenshot-translator/keys.toml。
endpoint = "https://translation.googleapis.com/language/translate/v2"

[translation.libretranslate]
# 可填自建或兼容 LibreTranslate 的实例。
endpoint = "http://127.0.0.1:5000/translate"
api_key = ""

[overlay]
# 译文遮罩透明度 0~255。
mask_alpha = 220
corner_radius = 4
padding = 3
font_min_px = 9
font_max_px = 28
# 胶囊按钮与截图的间距。
toolbar_gap = 6
# auto / below / above / inside
# auto：优先框外下方，其次上方，再不行放框内右下角。
toolbar_position = "auto"

[log]
level = "INFO"
max_bytes = 2097152
backup_count = 3
